<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>♥️</title>
  <script src="js/tailwindcss.js"></script>
  <link href="css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#7C3AED',
            secondary: '#64748B',
            accent: '#F59E0B',
            event: {
              annual: '#C7D2FE',
              wedding: '#FCA5A5',
              family: '#FDE68A',
              holiday: '#94A3B8',
              marriage: '#DDD6FE',
              other: '#E2E8F0'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          backgroundImage: {
            'calendar-pattern': "url('https://picsum.photos/id/104/1000/1000')",
          }
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            
            .calendar-day {
                /* 关键修改：使用 min-h-20 并添加 md:h-28 响应式高度 */
                @apply min-h-[120px] md:h-28 border border-gray-100 rounded-lg p-2 transition-all duration-300 
                       hover:border-primary hover:bg-purple-50 hover:shadow-md relative overflow-hidden;
            }
            
            .calendar-day-header {
                @apply h-12 flex items-center justify-center text-sm font-semibold text-secondary 
                       bg-purple-50 rounded-lg;
            }
            
            .event-badge {
                /* 关键修改：在移动端允许换行，在大屏幕上保持不换行和truncate */
                @apply text-xs px-1.5 py-0.5 rounded-md mb-1 shadow-sm 
                       transition-all duration-200 hover:scale-105 md:truncate md:whitespace-nowrap;
            }
            
            .gradient-border {
                @apply relative;
            }
            
            .gradient-border::before {
                content: "";
                @apply absolute inset-0 rounded-xl p-[2px] bg-gradient-to-r from-primary to-accent -z-10;
            }
            
            .today-highlight {
                @apply bg-primary/10 border-primary relative;
            }
            
            .today-highlight::after {
                content: "今天";
                @apply absolute -top-1 -right-1 bg-primary text-white text-xs px-1.5 py-0.5 rounded-full;
            }
            
            .month-title {
                @apply text-xl font-semibold text-primary flex items-center gap-2;
            }
            
            .decorative-icon {
                @apply absolute -bottom-4 -right-4 text-primary/5 transform rotate-12 text-6xl z-0;
            }
        }
  </style>
</head>

<body class="bg-gray-50 font-sans text-dark min-h-screen">
  <div class="fixed inset-0 bg-calendar-pattern opacity-5 bg-cover bg-center pointer-events-none"></div>

  <div class="container mx-auto px-4 py-8 max-w-6xl relative z-10">
    <header class="mb-8 text-center relative">
      <h1 class="text-[clamp(1.8rem,4vw,2.5rem)] font-bold text-dark mb-2 relative z-10">
        I♥️U
      </h1>
    </header>

    <main class="bg-white rounded-xl shadow-xl overflow-hidden gradient-border">
      <div class="bg-gradient-to-r from-primary to-accent text-white p-4 flex justify-center items-center">
        <h2 id="current-year" class="text-xl font-semibold">2025年11月 - 2026年2月</h2>
      </div>

      <!-- 关键修改：为容器添加 overflow-x-auto 以应对极端情况，并减小移动端的 gap -->
      <div id="calendar-container" class="p-2 md:p-6 overflow-x-auto">
        <div class="grid grid-cols-7 gap-1 md:gap-2 mb-4">
          <div class="calendar-day-header">日</div>
          <div class="calendar-day-header">一</div>
          <div class="calendar-day-header">二</div>
          <div class="calendar-day-header">三</div>
          <div class="calendar-day-header">四</div>
          <div class="calendar-day-header">五</div>
          <div class="calendar-day-header">六</div>
        </div>
      </div>
    </main>

  </div>

  <script>
    // 事件数据（无修改）
    const events = {
        '2025': {
          '11': {
            '20': ['买票'],
            '23': ['买返程票']
          },
          '12': {
            '4': ['休年假', '坐高铁回家', '拿户口本'],
            '5': ['休年假', '婚检', '登记'],
            '6': ['尝菜（待定）','十月十七'],
            '7': ['参加瑶瑶婚礼','十月十八', '返程回青岛']
          }
        },
        '2026': {
          '1': { 
            '24': ['坐高铁回家', '准备婚礼','腊月初六'], 
            '25': ['准备婚礼'], 
            '26': ['休年假', '准备婚礼'], 
            '27': ['休年假', '准备婚礼'], 
            '28': ['休婚假', '结婚啦💒'], 
            '29': ['休婚假', '耍💕'], 
            '30': ['休婚假', '耍💕'], 
            '31': ['休婚假', '耍💕'] },
          '2': { 
            '1': ['休婚假', '耍💕'], 
            '2': ['休婚假', '耍💕'], 
            '3': ['休婚假', '耍💕'], 
            '4': ['休婚假', '耍💕'], 
            '5': ['休婚假', '耍💕'], 
            '6': ['休婚假', '耍💕'], 
            '7': ['休婚假', '耍💕'], 
            '8': ['休婚假', '耍💕'], 
            '9': ['休婚假', '耍💕'], 
            '10': ['休婚假', '耍💕'], 
            '11': ['休婚假', '耍💕'], 
            '12': ['休婚假', '耍💕'], 
            '13': ['休婚假', '耍💕'], 
            '14': ['休婚假', '耍💕'], 
            '15': ['法定年假', '耍💕', '廿八'], 
            '16': ['法定年假', '耍💕', '除夕'], 
            '17': ['法定年假', '耍💕', '春节'], 
            '18': ['法定年假', '耍💕', '初二'], 
            '19': ['法定年假', '耍💕', '初三'], 
            '20': ['法定年假', '耍💕', '初四'], 
            '21': ['法定年假', '耍💕', '初五'], 
            '22': ['法定年假', '耍💕', '初六'], 
            '23': ['法定年假','返程回青岛', '初七'] 
          }
        }
      };

    // 获取事件样式（无修改）
    function getEventClass(event) {
      if (event.includes('休年假')) return 'bg-event-annual text-purple-800';
      if (event.includes('休婚假')) return 'bg-pink-100 text-gray-500';
      if (event.includes('婚检') || event.includes('登记')) return 'bg-event-marriage text-purple-800';
      if (event.includes('准备婚礼')) return 'bg-event-other text-red-800';
      if (event.includes('婚礼')) return 'bg-event-wedding text-red-800';
      if (event.includes('回家')) return 'bg-event-family text-yellow-800';
      if (event.includes('结婚')) return 'bg-red-800 text-gray-100';
      if (event.includes('法定年假')) return 'bg-red-400 text-gray-100';
      if (event.includes('票')) return 'bg-event-family text-yellow-800';
      if (event.includes('除夕')||event.includes('春节')||event.includes('初')) return 'bg-red-200 text-gray-1000';
      return 'bg-event-other text-gray-800';
    }

    // 生成日历（无修改）
    function generateCalendarForMonth(year, month) {
      const container = document.getElementById('calendar-container');
      const monthContainer = document.createElement('div');
      monthContainer.className = 'mb-8';

      const monthHeader = document.createElement('h3');
      monthHeader.className = 'month-title mb-3';
      const monthIcons = ['❄️', '❄️', '🌱', '🌱', '🌱', '☀️', '☀️', '☀️', '🍂', '🍂', '🍂', '❄️'];
      monthHeader.innerHTML = `${monthIcons[month]} ${year}年${month + 1}月`;
      monthContainer.appendChild(monthHeader);

      // 关键修改：减小移动端的 gap
      const calendarGrid = document.createElement('div');
      calendarGrid.className = 'grid grid-cols-7 gap-1 md:gap-2';

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const emptyDay = document.createElement('div');
        emptyDay.className = 'calendar-day bg-gray-50';
        calendarGrid.appendChild(emptyDay);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dayElement = document.createElement('div');
        dayElement.className = 'calendar-day';

        const dateElement = document.createElement('div');
        dateElement.className = 'text-sm font-medium mb-1';
        dateElement.textContent = day;
        dayElement.appendChild(dateElement);

        const monthStr = (month + 1).toString();
        const dayStr = day.toString();
        if (events[year] && events[year][monthStr] && events[year][monthStr][dayStr]) {
          const dayEvents = events[year][monthStr][dayStr];
          
          dayEvents.forEach(event => {
            const eventElement = document.createElement('div');
            eventElement.className = `event-badge ${getEventClass(event)}`;
            eventElement.textContent = event;
            dayElement.appendChild(eventElement);
          });
          dayElement.classList.add('border-primary/30', 'bg-purple-50/30');
          
          if (dayEvents.some(e => e.includes('结婚') || e.includes('婚礼'))) {
            const icon = document.createElement('i');
            icon.className = 'decorative-icon fa fa-heart';
            dayElement.appendChild(icon);
          } else if (dayEvents.some(e => e.includes('过年'))) {
            const icon = document.createElement('i');
            icon.className = 'decorative-icon fa fa-fire';
            dayElement.appendChild(icon);
          } 
        }

        const today = new Date();
        if (today.getFullYear() === year && today.getMonth() === month && today.getDate() === day) {
          dayElement.classList.add('today-highlight');
          dateElement.classList.add('text-primary', 'font-bold');
        }

        calendarGrid.appendChild(dayElement);
      }

      monthContainer.appendChild(calendarGrid);
      container.appendChild(monthContainer);
    }

    // 初始化日历（无修改）
    generateCalendarForMonth(2025, 10);
    generateCalendarForMonth(2025, 11);
    generateCalendarForMonth(2026, 0);
    generateCalendarForMonth(2026, 1);
  </script>
</body>
</html>
